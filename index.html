<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#222222">
<title>Agarwal Woodcraft Industries - Wood Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:18px 14px 30px}.brand{text-align:center;margin-bottom:16px}
.brand h1{font-size:22px;margin:0}.brand p{margin:5px 0;color:#666;font-size:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input{width:100%;height:48px;border:1px solid #ccc;border-radius:10px;padding:0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{margin-bottom:12px}
button{border:0;border-radius:10px;height:48px;padding:0 15px;font-size:15px;font-weight:700}
.add{width:100%;background:#222;color:#fff;margin-top:12px}.reset{width:100%;background:#eee;margin-top:10px}
.preview{background:#f7f7f7;border-radius:11px;padding:12px;margin-top:12px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;margin:5px 0}.big{font-size:21px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 3px;border-bottom:1px solid #ddd;text-align:left}th:nth-child(n+3),td:nth-child(n+3){text-align:right}
.del{height:34px;padding:0 8px;background:#eee;font-size:12px}
.empty{text-align:center;color:#777;padding:8px}
.note{font-size:12px;color:#666;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<div class="brand"><h1>🪵 Agarwal Woodcraft Industries</h1><p>Wood Measurement Calculator</p></div>

<div class="card">
<div class="full"><label>RATE PER SQ.FT (₹)</label><input id="rate" type="number" inputmode="decimal" min="0" step="0.01" value="100"></div>

<div class="grid">
<div><label>LENGTH (FEET)</label><input id="length" type="number" inputmode="decimal" min="0" step="0.01" placeholder="5"></div>
<div><label>WIDTH (INCHES)</label><input id="width" type="number" inputmode="decimal" min="0" step="0.01" placeholder="20"></div>
</div>

<div class="full" style="margin-top:10px"><label>QUANTITY</label><input id="qty" type="number" inputmode="numeric" min="1" step="1" value="1"></div>

<div class="preview">
<div class="row"><span>Sq.ft / piece</span><b id="pieceSqft">0.00</b></div>
<div class="row"><span>Total sq.ft</span><b id="lineSqft">0.00</b></div>
<div class="row"><span>Amount</span><b id="lineAmount">₹0.00</b></div>
</div>

<button class="add" id="add" type="button">＋ ADD PIECE</button>
<button class="reset" id="reset" type="button">NEW CALCULATION</button>
</div>

<div class="card">
<div class="row big"><span>Grand Total</span><b id="grand">₹0.00</b></div>
<div class="row"><span>Total Square Feet</span><b id="totalSqft">0.00</b></div>
<div id="items" style="margin-top:12px"><div class="empty">No pieces added yet.</div></div>
</div>

<div class="note"><b>Formula:</b> Length (ft) × Width (in) ÷ 12 = sq.ft per piece.<br>Then × quantity × rate = amount.</div>
</div>

<script>
(function(){
var rate=document.getElementById("rate"),length=document.getElementById("length"),width=document.getElementById("width"),qty=document.getElementById("qty");
var pieceSqft=document.getElementById("pieceSqft"),lineSqft=document.getElementById("lineSqft"),lineAmount=document.getElementById("lineAmount");
var grand=document.getElementById("grand"),totalSqft=document.getElementById("totalSqft"),items=document.getElementById("items"),pieces=[];
function n(v){var x=Number(v);return Number.isFinite(x)&&x>0?x:0}
function money(x){return "₹"+x.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function updatePreview(){
 var l=n(length.value),w=n(width.value),q=n(qty.value)||1,r=n(rate.value),a=l*w/12;
 pieceSqft.textContent=a.toFixed(2);lineSqft.textContent=(a*q).toFixed(2);lineAmount.textContent=money(a*q*r);
 updateTotal();
}
function updateTotal(){
 var r=n(rate.value),sq=0,amt=0;
 pieces.forEach(function(p){sq+=p.area*p.qty;amt+=p.area*p.qty*r});
 var l=n(length.value),w=n(width.value),q=n(qty.value),a=l*w/12;
 if(l&&w){sq+=a*q;amt+=a*q*r}
 totalSqft.textContent=sq.toFixed(2);grand.textContent=money(amt);
}
function render(){
 if(!pieces.length){items.innerHTML='<div class="empty">No pieces added yet.</div>';return}
 var h='<table><tr><th>#</th><th>Size</th><th>Qty</th><th>Sq.ft</th><th></th></tr>';
 pieces.forEach(function(p,i){
   h+='<tr><td>'+(i+1)+'</td><td>'+p.l+' × '+p.w+'</td><td>'+p.qty+'</td><td>'+(p.area*p.qty).toFixed(2)+'</td><td><button class="del" data-i="'+i+'" type="button">Delete</button></td></tr>';
 });
 items.innerHTML=h;
 items.querySelectorAll(".del").forEach(function(b){b.addEventListener("click",function(){pieces.splice(Number(b.dataset.i),1);render();updateTotal()})});
}
[rate,length,width,qty].forEach(function(x){x.addEventListener("input",updatePreview)});
document.getElementById("add").addEventListener("click",function(){
 var l=n(length.value),w=n(width.value),q=Math.floor(n(qty.value));
 if(!l||!w||!q){alert("Please enter length, width and quantity.");return}
 pieces.push({l:l,w:w,qty:q,area:l*w/12});render();
 length.value="";width.value="";qty.value="1";updatePreview();length.focus();
});
document.getElementById("reset").addEventListener("click",function(){
 pieces=[];rate.value="100";length.value="";width.value="";qty.value="1";render();updatePreview();length.focus();
});
updatePreview();render();
})();
</script>
</body>
</html>
