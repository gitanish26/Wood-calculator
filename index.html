<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agarwal Woodcraft Industries</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:620px;margin:auto;min-height:100vh;padding:22px 14px 28px}
header{text-align:center;padding:10px 8px 22px}
.logo{font-size:42px}
h1{font-size:28px;margin:4px 0;font-weight:900}
.sub{color:#aaa;font-size:15px;margin-top:6px}
.location{color:#079b92;font-size:12px;font-weight:800;letter-spacing:.8px;margin-top:8px}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:block;text-decoration:none;color:#fff;background:#111;border:1px solid #242424;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px #0008}
.art{height:175px;background:#f4f1eb;display:flex;align-items:center;justify-content:center;overflow:hidden}
.label{background:#079b92;text-align:center;font-weight:900;font-size:20px;padding:15px 8px}
.desc{background:#111;color:#aaa;text-align:center;font-size:12px;padding:9px 6px 13px;min-height:49px}

.wood-plank{width:88%;height:55%;background:linear-gradient(165deg,#b98550,#75421f);border-radius:7px;box-shadow:10px 12px 0 #5a3219,18px 20px 0 #9c693c;transform:rotate(-7deg);position:relative}
.wood-plank:after{content:"";position:absolute;inset:8px;background:repeating-linear-gradient(8deg,transparent 0 8px,#4e2b16 9px 11px,transparent 12px 21px);opacity:.25}
.logs{position:relative;width:90%;height:120px}
.log{position:absolute;width:75px;height:112px;border-radius:50%;background:#c28b51;border:7px solid #75431f;box-shadow:inset 0 0 0 8px #e0b878;transform:rotate(90deg)}
.log:after{content:"";position:absolute;inset:18px;border-radius:50%;border:2px solid #9c693c;opacity:.7}
.l1{left:55px;top:10px}.l2{left:115px;top:5px}.l3{left:175px;top:18px}.l4{left:95px;top:34px;transform:rotate(90deg) scale(.88)}

.footer{text-align:center;color:#888;font-size:12px;margin-top:22px}
.footer b{color:#fff}
@media(max-width:430px){.cards{gap:9px}.art{height:155px}.label{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">🪵</div>
  <h1>Agarwal Woodcraft Industries</h1>
  <div class="sub">Wood Measurement Calculator</div>
  <div class="location">MANNARGUDI • WOOD CALCULATOR</div>
</header>

<div class="cards">
  <a class="card" href="./Wood_Plank_Calculator.html">
    <div class="art">
      <div class="wood-plank"></div>
    </div>
    <div class="label">WOOD PLANK</div>
    <div class="desc">Cut size / plank measurement<br>Length × Width → Sq.ft & Amount</div>
  </a>

  <a class="card" href="./Agarwal_Raw_Wood_Calculator.html">
    <div class="art">
      <div class="logs">
        <div class="log l1"></div><div class="log l2"></div>
        <div class="log l3"></div><div class="log l4"></div>
      </div>
    </div>
    <div class="label">RAW WOOD / TREE</div>
    <div class="desc">Round log measurement<br>Length × Perimeter → CuFt & CuM</div>
  </a>
</div>

<div class="footer">
  Created by <b>Anishkumar Agarwal</b>
</div>
</div>
</body>
</html>
