<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agarwal Woodcraft - Raw Wood Calculator</title>
<style>
*{box-sizing:border-box}
:root{--teal:#079b92;--orange:#f15a24;--dark:#111;--panel:#171717}
body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:620px;margin:auto;min-height:100vh;background:#090909;padding-bottom:28px}
header{text-align:center;padding:22px 16px 16px}
header h1{font-size:27px;margin:0;font-weight:850}
header .sub{color:#aaa;margin-top:5px;font-size:14px}
.brand{color:#f3f3f3;font-size:12px;margin-top:7px}

.card{margin:10px 14px;background:#111;border:1px solid #222;border-radius:14px;padding:15px}
.title{color:var(--teal);font-weight:850;font-size:18px;margin-bottom:13px}
label{display:block;color:#ddd;font-weight:750;font-size:13px;margin-bottom:6px}
input,select{width:100%;background:#050505;color:#fff;border:1px solid #444;border-radius:10px;padding:14px;font-size:18px;outline:none}
input:focus,select:focus{border-color:var(--teal)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

.result{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.resultBox{background:#151515;border-radius:10px;padding:13px}
.resultBox span{display:block;color:#aaa;font-size:12px;font-weight:700}
.resultBox b{display:block;font-size:21px;margin-top:4px}
.big{border-top:2px solid var(--orange);padding-top:13px;margin-top:14px}
.big .resultBox{background:#0d0d0d}
.big b{font-size:25px;color:#fff}

button{border:0;border-radius:10px;font-size:17px;font-weight:850;padding:14px;cursor:pointer}
.add{width:100%;background:var(--teal);color:white;margin-top:12px}
.clear{width:100%;background:#222;color:#ddd;margin-top:10px}
.save{width:100%;background:var(--orange);color:white;margin-top:10px}
.remove{background:#2a1110;color:#ff8060;padding:7px 10px;font-size:12px}
.piece{border-top:1px solid #292929;padding-top:14px;margin-top:14px}
.piece:first-child{border-top:0;margin-top:0;padding-top:0}
.pieceHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pieceHead b{color:#fff}
.hint{color:#888;font-size:12px;line-height:1.5;margin-top:10px}
.records{display:none}
.record{border-bottom:1px solid #2b2b2b;padding:12px 0}
.record:last-child{border-bottom:0}
.record b{color:var(--teal)}
.empty{color:#777;text-align:center;padding:10px}
.footer{text-align:center;color:#aaa;font-size:12px;padding:12px 16px 0}
.footer b{color:#fff}
@media(max-width:420px){header h1{font-size:24px}.grid3{grid-template-columns:1fr}.result{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🪵 Raw Wood Calculator</h1>
  <div class="sub">Round Log / Raw Wood Measurement</div>
  <div class="brand">AGARWAL WOODCRAFT INDUSTRIES • MANNARGUDI</div>
</header>

<div class="card">
  <div class="title">RAW WOOD DETAILS</div>
  <div id="pieces"></div>
  <button class="add" id="add">＋ ADD RAW WOOD</button>
</div>

<div class="card">
  <div class="title">TOTAL</div>
  <div class="result big">
    <div class="resultBox"><span>CuFt</span><b id="totalCuft">0.000</b></div>
    <div class="resultBox"><span>CuM</span><b id="totalCum">0.0000</b></div>
  </div>
  <div class="result">
    <div class="resultBox"><span>Total Quantity</span><b id="totalQty">0</b></div>
    <div class="resultBox"><span>No. of Logs</span><b id="totalLogs">0</b></div>
  </div>
  <button class="save" id="save">SAVE RECORD</button>
  <button class="clear" id="clear">NEW CALCULATION</button>
</div>

<div class="card records" id="recordsCard">
  <div class="title">SAVED RECORDS</div>
  <div id="records"></div>
</div>

<div class="footer">
  Formula: <b>Length (ft) × Perimeter² (inch) ÷ 2304 = CuFt</b><br>
  Created by <b>Anishkumar Agarwal</b>
</div>
</div>

<script>
(function(){
  const piecesEl=document.getElementById('pieces');
  const recordsCard=document.getElementById('recordsCard');
  const recordsEl=document.getElementById('records');
  let count=0;

  function n(v){return parseFloat(v)||0}
  function money(v){return v.toFixed(3)}
  function addPiece(length='',perimeter='',qty=1){
    count++;
    const p=document.createElement('div');
    p.className='piece';
    p.innerHTML=`
      <div class="pieceHead">
        <b>Raw Wood ${count}</b>
        <button type="button" class="remove">REMOVE</button>
      </div>
      <div class="grid3">
        <div><label>Length (feet)</label><input class="length" type="number" min="0" step="0.01" placeholder="4.50" value="${length}"></div>
        <div><label>Perimeter (inch)</label><input class="perimeter" type="number" min="0" step="0.01" placeholder="33.00" value="${perimeter}"></div>
        <div><label>Quantity (nos)</label><input class="qty" type="number" min="1" step="1" value="${qty}"></div>
      </div>
      <div class="result">
        <div class="resultBox"><span>CuFt / Piece</span><b class="cuft">0.000</b></div>
        <div class="resultBox"><span>CuM / Piece</span><b class="cum">0.0000</b></div>
      </div>
      <div class="hint">Round-log formula: Length × Perimeter² ÷ 2304</div>`;
    piecesEl.appendChild(p);
    p.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));
    p.querySelector('.remove').onclick=()=>{p.remove();renumber();calc()};
    calc();
  }

  function renumber(){
    piecesEl.querySelectorAll('.piece').forEach((p,i)=>{
      p.querySelector('.pieceHead b').textContent='Raw Wood '+(i+1);
    });
    count=piecesEl.querySelectorAll('.piece').length;
  }

  function calc(){
    let totalCuft=0,totalQty=0,logs=0;
    piecesEl.querySelectorAll('.piece').forEach(p=>{
      const l=n(p.querySelector('.length').value);
      const per=n(p.querySelector('.perimeter').value);
      const q=Math.max(0,n(p.querySelector('.qty').value));
      const one=l*per*per/2304;
      const total=one*q;
      const cum=total*0.028316846592;
      p.querySelector('.cuft').textContent=money(one);
      p.querySelector('.cum').textContent=cum.toFixed(4);
      totalCuft+=total;
      totalQty+=q;
      if(l>0 && per>0) logs+=q;
    });
    document.getElementById('totalCuft').textContent=money(totalCuft);
    document.getElementById('totalCum').textContent=(totalCuft*0.028316846592).toFixed(4);
    document.getElementById('totalQty').textContent=totalQty;
    document.getElementById('totalLogs').textContent=logs;
  }

  document.getElementById('add').onclick=()=>addPiece();
  document.getElementById('clear').onclick=()=>{
    piecesEl.innerHTML=''; count=0; addPiece();
  };
  document.getElementById('save').onclick=()=>{
    const items=[];
    piecesEl.querySelectorAll('.piece').forEach(p=>{
      const l=n(p.querySelector('.length').value), per=n(p.querySelector('.perimeter').value), q=n(p.querySelector('.qty').value);
      if(l>0&&per>0&&q>0) items.push({l,per,q,cuft:l*per*per/2304*q});
    });
    if(!items.length){alert('Please enter at least one raw wood piece.');return}
    const total=items.reduce((s,x)=>s+x.cuft,0);
    const rec=document.createElement('div'); rec.className='record';
    rec.innerHTML=`<b>${new Date().toLocaleString('en-IN')}</b><br>${items.length} entries • ${items.reduce((s,x)=>s+x.q,0)} nos • <strong>${total.toFixed(3)} CuFt</strong>`;
    recordsEl.prepend(rec); recordsCard.style.display='block';
  };

  addPiece();
})();
</script>
</body>
</html>
